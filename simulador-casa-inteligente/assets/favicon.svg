<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A0A0E"/>
      <stop offset="100%" stop-color="#12131A"/>
    </linearGradient>
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6"/>
      <stop offset="100%" stop-color="#0038FF"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Container com cantos suaves -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="#1E2230" stroke-width="2"/>

  <!-- Ícone Smart Home IoT (Casa + Mesh) -->
  <g transform="translate(12, 10)">
    <!-- Teto da Casa Isométrico -->
    <path d="M 20 4 L 36 16 L 20 28 L 4 16 Z" fill="url(#blueGrad)" opacity="0.9"/>
    
    <!-- Paredes da Casa -->
    <path d="M 4 16 L 20 28 L 20 40 L 4 28 Z" fill="#1E2640" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round"/>
    <path d="M 36 16 L 20 28 L 20 40 L 36 28 Z" fill="#2A355A" stroke="#3B82F6" stroke-width="1.5" stroke-linejoin="round"/>
    
    <!-- Antena / Ondas de Rádio RF Zigbee -->
    <circle cx="20" cy="14" r="3" fill="#00F0FF" filter="url(#glow)"/>
    <path d="M 14 10 A 8 8 0 0 1 26 10" fill="none" stroke="#00F0FF" stroke-width="2" stroke-linecap="round" opacity="0.8"/>
    <path d="M 10 6 A 14 14 0 0 1 30 6" fill="none" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round" opacity="0.6"/>
  </g>
</svg>
